name: Release

# Push a tag like v0.2.0 to build packages for all platforms and publish them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Disk Inventory NG ${GITHUB_REF_NAME#v}" --generate-notes

  macos:
    needs: create
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: scripts/make-dmg.sh universal
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/release/bundle/*.dmg --clobber

  linux:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older Ubuntu = older glibc, so the binaries run on more distributions.
          - name: x86_64
            runner: ubuntu-22.04
            appimage: x86_64
          - name: arm64 (Raspberry Pi 3/4/5, 64-bit OS)
            runner: ubuntu-22.04-arm
            appimage: aarch64
          - name: armhf (Raspberry Pi, 32-bit OS)
            runner: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
    name: linux ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libfuse2
          if [ -n "$TARGET" ]; then sudo apt-get install -y gcc-arm-linux-gnueabihf; fi
      - name: Install appimagetool
        if: matrix.appimage
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage }}.AppImage
          chmod +x /usr/local/bin/appimagetool
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: scripts/package-linux.sh
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/release/bundle/*.tar.gz $(ls target/release/bundle/*.AppImage 2>/dev/null) --clobber

  windows:
    needs: create
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/package-windows.ps1
        shell: pwsh
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" target/release/bundle/*.zip --clobber
