[package]
name = "disk-inventory-ng"
version = "0.1.0"
edition = "2024"

[dependencies]
bytesize = "1"
eframe = "0.29"
libc = "0.2.190"
rfd = "0.15"
trash = "5"

# The treemap renderer is pixel-heavy; keep debug builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
