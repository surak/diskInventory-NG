[package]
name = "disk-inventory-ng"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/surak/diskInventory-NG"
authors = ["Alexandre Strube"]
description = "Disk usage visualizer with cushion treemaps, inspired by Disk Inventory X"

[dependencies]
bytesize = "1"
eframe = "0.29"
png = "0.18.1"
rayon = "1.12.0"
rfd = "0.15"
trash = "5"

# The treemap renderer is pixel-heavy; keep debug builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.190"

[target.'cfg(not(target_os = "macos"))'.dependencies]
sysinfo = { version = "0.38.4", default-features = false, features = ["disk"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
